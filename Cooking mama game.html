          dragClone.style.top = `${startY - 22}px`;
          document.body.appendChild(dragClone);
          chipSource.setPointerCapture(e.pointerId);
        });

        chipSource.addEventListener('pointermove', (e) => {
          if (!isDragging || !dragClone) return;
          const curX = e.clientX || (e.touches && e.touches[0].clientX);
          const curY = e.clientY || (e.touches && e.touches[0].clientY);
          dragClone.style.left = `${curX - 22}px`;
          dragClone.style.top = `${curY - 22}px`;
        });

        chipSource.addEventListener('pointerup', (e) => {
          if (!isDragging) return;
          isDragging = false;
          if (dragClone) { dragClone.remove(); dragClone = null; }

          const curX = e.clientX || (e.touches && e.changedTouches[0].clientX);
          const curY = e.clientY || (e.touches && e.changedTouches[0].clientY);

          slotsPos.forEach(s => {
            const r = s.el.getBoundingClientRect();
            if (curX >= r.left && curX <= r.right && curY >= r.top && curY <= r.bottom) {
              if (s.chips < 3 && chipsLeft > 0) {
                s.chips++;
                chipsLeft--;
                chipsCountLabel.textContent = chipsLeft;

                const bit = document.createElement('div');
                bit.className = 'chunk-bit';
                if (s.chips === 1) { bit.style.top = '18%'; bit.style.left = '22%'; }
                else if (s.chips === 2) { bit.style.top = '30%'; bit.style.left = '60%'; }
                else { bit.style.top = '62%'; bit.style.left = '36%'; }
                s.el.appendChild(bit);

                if (chipsLeft === 0) finish();
              }
            }
          });
        });

        function finish() {
          clearInterval(activeTimer);
          const perfectCookies = slotsPos.filter(s => s.chips === 3).length;
          const score = Math.round((perfectCookies / 6) * 100);
          recordScore('step7B', score);

          if (score === 100) {
            showRating("ALLE 6 PERFEKT! ★★★", "perfect");
            showMama("💖", '"Genial! Jeder Cookie hat exakt 3 Chunks!"');
          } else {
            showRating("NICHT GLEICHMÄSSIG!", "good");
          }
          setTimeout(prepStep8A, 1400);
        }
      }

      /* ========================================================
         SCHRITT 8A: BACKEN IM OFEN
      ======================================================== */
      function prepStep8A() {
        showStepIntro(
          "🔥🍪",
          "Schritt 8A: Backen im Ofen",
          "Beobachte die 6 Cookies im Ofen. Sobald die Ränder goldbraun sind (Zielbereich), ziehe das Blech sofort nach unten heraus!",
          startStep8A
        );
      }

      function startStep8A() {
        const cfg = modeConfigs[currentMode];
        stepPill.textContent = `${cfg.name}: SCHRITT 8A`;
        timerBadge.textContent = "🔥 160 °C";
        let bakeProgress = 0;
        let isPulled = false;

        showMama("👩‍🍳", '"Zieh das Blech bei Goldbraun heraus!"');

        touchScreen.innerHTML = `
          <div style="font-size: 0.92rem; font-weight: 700;">Zieh das Blech bei Goldbraun heraus!</div>
          <div class="oven-bake-box" id="bakeStage">
            <div class="sliding-cookie-tray" id="cookieTray">
              <div style="width: 90px; height: 9px; background: #a8a29e; border-radius: 5px; border: 2px solid var(--text-dark);"></div>
              <div class="cookies-tray-grid">
                <div class="bake-cookie-mini"><div class="c-drop d1"></div><div class="c-drop d2"></div><div class="c-drop d3"></div></div>
                <div class="bake-cookie-mini"><div class="c-drop d1"></div><div class="c-drop d2"></div><div class="c-drop d3"></div></div>
                <div class="bake-cookie-mini"><div class="c-drop d1"></div><div class="c-drop d2"></div><div class="c-drop d3"></div></div>
                <div class="bake-cookie-mini"><div class="c-drop d1"></div><div class="c-drop d2"></div><div class="c-drop d3"></div></div>
                <div class="bake-cookie-mini"><div class="c-drop d1"></div><div class="c-drop d2"></div><div class="c-drop d3"></div></div>
                <div class="bake-cookie-mini"><div class="c-drop d1"></div><div class="c-drop d2"></div><div class="c-drop d3"></div></div>
              </div>
            </div>
            <div class="hint-arrow-bounce">⬇️ BLECH NACH UNTEN ZIEHEN! ⬇️</div>
          </div>
          <div class="generic-meter">
            <div class="meter-zone-target" style="left: 62%; width: 20%;"></div>
            <div class="meter-bar-fill" id="cookieBakeFill"></div>
          </div>
        `;

        const tray = document.getElementById('cookieTray');
        const fill = document.getElementById('cookieBakeFill');
        const minis = document.querySelectorAll('.bake-cookie-mini');

        activeLoop = setInterval(() => {
          if (isPulled) return;
          bakeProgress += 1;
          fill.style.width = `${bakeProgress}%`;

          if (bakeProgress === 25) {
            minis.forEach(m => m.style.transform = 'scale(1.15, 1.05)');
          } else if (bakeProgress === 62) {
            minis.forEach(m => {
              m.style.background = 'radial-gradient(circle, #fef08a 25%, #d97706 70%, #b45309 100%)';
              m.style.borderColor = '#78350f';
            });
            showMama("💖", '"JETZT ZIEHEN!"');
          }

          if (bakeProgress >= 100) {
            clearInterval(activeLoop);
            isPulled = true;
            recordScore('step8A', 20);
            showRating("ZU DURCH!", "bad");
            setTimeout(prepStep8B, 1200);
          }
        }, cfg.bakeLoop8A);

        let isDragging = false;
        let startY = 0;

        tray.addEventListener('pointerdown', (e) => {
          if (isPulled) return;
          isDragging = true;
          startY = e.clientY || (e.touches && e.touches[0].clientY);
          tray.style.transition = 'none';
          tray.setPointerCapture(e.pointerId);
        });

        tray.addEventListener('pointermove', (e) => {
          if (!isDragging || isPulled) return;
          const curY = e.clientY || (e.touches && e.touches[0].clientY);
          const deltaY = curY - startY;

          if (deltaY > 0) {
            const newY = Math.min(180, 25 + deltaY);
            tray.style.top = `${newY}px`;

            if (newY >= 135) {
              isDragging = false;
              isPulled = true;
              clearInterval(activeLoop);
              tray.style.transition = 'top 0.3s ease-out';
              tray.style.top = '190px';

              if (bakeProgress >= 62 && bakeProgress <= 82) {
                recordScore('step8A', 100);
                showRating("PERFEKT WEICH! ★★★", "perfect");
              } else {
                recordScore('step8A', Math.max(20, 60 - (10 * cfg.penaltyFactor)));
                showRating("GUT! ★★", "good");
              }
              setTimeout(prepStep8B, 1200);
            }
          }
        });

        tray.addEventListener('pointerup', () => {
          if (!isDragging || isPulled) return;
          isDragging = false;
          tray.style.transition = 'top 0.2s ease-out';
          tray.style.top = '25px';
        });
      }

      /* ========================================================
         SCHRITT 8B: NACHZIEHEN & GITTER
      ======================================================== */
      function prepStep8B() {
        const cfg = modeConfigs[currentMode];
        showStepIntro(
          "⏳🏁",
          `Schritt 8B: Nachziehen & Gitter (${cfg.t8B_move}s)`,
          `Warte die ${cfg.t8B_rest}s Nachziehzeit ab. Danach hast du ${cfg.t8B_move}s Zeit, um alle 6 Cookies aufs Gitter zu ziehen!`,
          startStep8B
        );
      }

      function startStep8B() {
        const cfg = modeConfigs[currentMode];
        let restTime = cfg.t8B_rest;
        let moveTimeLimit = cfg.t8B_move;
        let cookiesResting = true;
        let movedCount = 0;
        let brokenCount = 0;

        stepPill.textContent = `${cfg.name}: SCHRITT 8B`;
        timerBadge.textContent = `⏳ ${restTime}s RUHE`;
        timerBadge.className = 'timer-badge warning';
        showMama("👩‍🍳", '"NICHT berühren, solange sie dampfen!"');

        touchScreen.innerHTML = `
          <div id="restNotice" style="font-weight: 700; font-size: 0.92rem; color: #b91c1c;">
            🔥 Noch zu weich! Nachziehen lassen... (<span id="restSecs">${restTime}</span>s)
          </div>
          <div style="width: 100%; max-width: 330px; height: 265px; display: flex; flex-direction: column; justify-content: space-between;">
            <div class="hot-cooling-pan" id="pan">
              <div class="cookie-moveable"><div class="c-drop d1"></div><div class="c-drop d2"></div><div class="c-drop d3"></div><span style="position: absolute; left: 14px;">♨️</span></div>
              <div class="cookie-moveable"><div class="c-drop d1"></div><div class="c-drop d2"></div><div class="c-drop d3"></div><span style="position: absolute; left: 14px;">♨️</span></div>
              <div class="cookie-moveable"><div class="c-drop d1"></div><div class="c-drop d2"></div><div class="c-drop d3"></div><span style="position: absolute; left: 14px;">♨️</span></div>
              <div class="cookie-moveable"><div class="c-drop d1"></div><div class="c-drop d2"></div><div class="c-drop d3"></div><span style="position: absolute; left: 14px;">♨️</span></div>
              <div class="cookie-moveable"><div class="c-drop d1"></div><div class="c-drop d2"></div><div class="c-drop d3"></div><span style="position: absolute; left: 14px;">♨️</span></div>
              <div class="cookie-moveable"><div class="c-drop d1"></div><div class="c-drop d2"></div><div class="c-drop d3"></div><span style="position: absolute; left: 14px;">♨️</span></div>
            </div>
            <div class="cooling-wire-rack" id="rack"></div>
          </div>
          <div id="subNotice" style="font-weight: 700; font-size: 0.9rem; margin-top: 0.2rem;">Finger weg!</div>
        `;

        const restNotice = document.getElementById('restNotice');
        const restSecs = document.getElementById('restSecs');
        const subNotice = document.getElementById('subNotice');
        const rack = document.getElementById('rack');
        const cookies = document.querySelectorAll('.cookie-moveable');

        activeTimer = setInterval(() => {
          restTime--;
          if (restTime > 0) {
            restSecs.textContent = restTime;
          } else {
            clearInterval(activeTimer);
            cookiesResting = false;
            restNotice.textContent = "✨ Stabil! Schnell alle 6 Cookies aufs Gitter!";
            restNotice.style.color = '#15803d';
            subNotice.textContent = `Zieh sie aufs Gitter (0 / 6)!`;
            document.querySelectorAll('.cookie-moveable span').forEach(s => s.remove());

            startMoveTimer();
          }
        }, 1000);

        function startMoveTimer() {
          timerBadge.textContent = `⏱️ ${moveTimeLimit < 10 ? '0' : ''}${moveTimeLimit}s`;
          activeTimer = setInterval(() => {
            moveTimeLimit--;
            timerBadge.textContent = `⏱️ ${moveTimeLimit < 10 ? '0' : ''}${moveTimeLimit}s`;
            if (moveTimeLimit <= 3) timerBadge.classList.add('warning');
            if (moveTimeLimit <= 0) {
              clearInterval(activeTimer);
              const score = Math.max(10, Math.round(((movedCount) / 6) * 100 - brokenCount * 25 * cfg.penaltyFactor));
              recordScore('step8B', score);
              showFinalGameScreen();
            }
          }, 1000);
        }

        cookies.forEach(cookie => {
          let isDragging = false;
          let startX, startY;

          cookie.addEventListener('pointerdown', (e) => {
            if (cookie.classList.contains('broken')) return;

            if (cookiesResting) {
              cookie.classList.add('broken');
              brokenCount++;
              showRating("ZERBROCHEN! 💔", "bad");
              showMama("🥺", '"Ich habe gesagt warten!"', true);
              return;
            }

            isDragging = true;
            startX = e.clientX || (e.touches && e.touches[0].clientX);
            startY = e.clientY || (e.touches && e.touches[0].clientY);
            cookie.setPointerCapture(e.pointerId);
            cookie.style.zIndex = '100';
          });

          cookie.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const curX = e.clientX || (e.touches && e.touches[0].clientX);
            const curY = e.clientY || (e.touches && e.touches[0].clientY);
            cookie.style.transform = `translate(${curX - startX}px, ${curY - startY}px) scale(1.15)`;
          });

          cookie.addEventListener('pointerup', (e) => {
            if (!isDragging) return;
            isDragging = false;
            const curX = e.clientX || (e.touches && e.changedTouches[0].clientX);
            const curY = e.clientY || (e.touches && e.changedTouches[0].clientY);
            const rackRect = rack.getBoundingClientRect();

            if (curX >= rackRect.left && curX <= rackRect.right && curY >= rackRect.top && curY <= rackRect.bottom) {
              rack.appendChild(cookie);
              cookie.style.transform = 'translate(0, 0)';
              cookie.style.cursor = 'default';
              cookie.style.pointerEvents = 'none';
              movedCount++;
              subNotice.textContent = `Zieh sie aufs Gitter (${movedCount} / 6)`;

              if (movedCount + brokenCount >= 6) {
                clearInterval(activeTimer);
                const score = Math.max(15, Math.round(((6 - brokenCount) / 6) * 100));
                recordScore('step8B', score);
                showFinalGameScreen();
              }
            } else {
              cookie.style.transform = 'translate(0, 0)';
              cookie.style.zIndex = '10';
            }
          });
        });
      }

      /* ========================================================
         FINALE MIT BEWERTUNGSSYSTEM (F BIS S++)
      ======================================================== */
      function showFinalGameScreen() {
        const scoreValues = Object.values(scores);
        const totalScore = Math.round(scoreValues.reduce((a, b) => a + b, 0) / scoreValues.length);
        const cfg = modeConfigs[currentMode];

        let rank = "F";
        let rankClass = "rank-f";
        let mamaText = '"Oh weh... da ist einiges schiefgelaufen! Übung macht den Meister!"';

        if (totalScore >= 98) {
          rank = "S++";
          rankClass = "rank-splusplus";
          mamaText = `"UNGLAUBLICH! Ein fehlerfreier Meisterlauf auf ${cfg.name}! GODLIKE!"`;
        } else if (totalScore >= 93) {
          rank = "S+";
          rankClass = "rank-splus";
          mamaText = '"BETTER THAN MAMA! Absolut meisterhaft gebacken!"';
        } else if (totalScore >= 88) {
          rank = "S";
          rankClass = "rank-s";
          mamaText = '"WONDERFUL! Ein erstklassiges Meisterwerk ohne Makel!"';
        } else if (totalScore >= 80) {
          rank = "A";
          rankClass = "rank-a";
          mamaText = '"Großartige Leistung! Die Cookies schmecken fantastisch!"';
        } else if (totalScore >= 70) {
          rank = "B";
          rankClass = "rank-b";
          mamaText = '"Sehr solide gebacken! Ein paar kleine Fehler!"';
        } else if (totalScore >= 60) {
          rank = "C";
          rankClass = "rank-c";
          mamaText = '"Ganz passabel, aber die Hektik hat Punkte gekostet!"';
        } else if (totalScore >= 45) {
          rank = "D";
          rankClass = "rank-d";
          mamaText = '"Knapp bestanden! Mama hilft dir beim nächsten Mal!"';
        }

        showRating(rank === "S++" || rank === "S+" ? "GODLIKE! ★★★" : "FERTIG! ★", "perfect");
        showMama("👩‍🍳", mamaText);

        setTimeout(() => {
          stepPill.textContent = `${cfg.name}: ${totalScore} / 100`;
          timerBadge.textContent = `RANG: ${rank}`;

          touchScreen.innerHTML = `
            <div style="font-size: 2.8rem; margin-top: 0.2rem; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.2));">
              🍪✨🌿✨🍪
            </div>
            
            <div class="rank-badge ${rankClass}">
              ${rank}
            </div>

            <div style="font-size: 1.15rem; font-weight: 700; color: var(--mama-pink-dark); margin-bottom: 0.2rem;">
              Modus: ${cfg.name} (${totalScore} %)
            </div>
            <p style="font-size: 0.88rem; font-weight: 600; text-align: center; max-width: 320px; line-height: 1.35; margin-bottom: 1rem;">
              Alle 6 Fudgy-Cookies mit je 3 Chunks sind gebacken und gerettet!
            </p>
            <button class="btn-mama btn-green" id="btnPlayAgain">🔄 Anderen Modus wählen</button>
          `;

          document.getElementById('btnPlayAgain').onclick = showModeSelection;
        }, 1500);
      }

      // Startet direkt im Modus-Auswahlmenü
      showModeSelection();
    });
  </script>
</body>
</html>
