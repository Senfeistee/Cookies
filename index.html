<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cooking Mama: Magic Kitchen Hub!</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Mali:wght@500;700&display=swap');

    :root {
      --mama-pink: #ff5e84;
      --mama-pink-dark: #d93d62;
      --mama-yellow: #ffde59;
      --mama-yellow-dark: #e5be27;
      --mama-blue: #4dc9f6;
      --mama-green: #7ed957;
      --mama-green-dark: #5cb835;
      --mama-bg-pattern: #ffccd5;
      --card-bg: #ffffff;
      --text-dark: #4a2c2a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', 'Mali', cursive, sans-serif;
    }

    body {
      background-color: #fff0f3;
      background-image: 
        linear-gradient(45deg, var(--mama-bg-pattern) 25%, transparent 25%), 
        linear-gradient(-45deg, var(--mama-bg-pattern) 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, var(--mama-bg-pattern) 75%), 
        linear-gradient(-45deg, transparent 75%, var(--mama-bg-pattern) 75%);
      background-size: 40px 40px;
      background-position: 0 0, 0 20px, 20px -20px, -20px 0px;
      color: var(--text-dark);
      padding: 3rem 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    .hub-card {
      background: white;
      border: 5px solid var(--mama-pink);
      border-radius: 30px;
      padding: 2rem;
      box-shadow: 0 10px 0px var(--mama-pink-dark);
      position: relative;
    }

    .header-badge {
      display: inline-block;
      background: var(--mama-yellow);
      border: 3px solid var(--text-dark);
      color: var(--text-dark);
      padding: 0.3rem 1.2rem;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 0.8rem;
      transform: rotate(-3deg);
      box-shadow: 0 4px 0 rgba(0,0,0,0.15);
    }

    h1 {
      font-size: 2.2rem;
      color: var(--mama-pink);
      text-shadow: 2px 2px 0px #fff, 4px 4px 0px var(--text-dark);
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      font-size: 1.05rem;
      color: #7a5250;
      font-weight: 600;
      margin-bottom: 2rem;
    }

    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .menu-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fdfaf6;
      border: 4px solid var(--text-dark);
      border-radius: 20px;
      padding: 1.2rem 1.5rem;
      text-decoration: none;
      color: var(--text-dark);
      font-weight: 700;
      font-size: 1.15rem;
      box-shadow: 0 5px 0 var(--text-dark);
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .menu-btn:hover {
      background: #fff9fa;
    }

    .menu-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 var(--text-dark);
    }

    .menu-btn.calculator {
      border-color: var(--mama-blue);
      background: #eef8ff;
    }

    .menu-btn.game {
      border-color: var(--mama-green-dark);
      background: #e6f9ed;
    }

    .menu-icon {
      font-size: 2rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="hub-card">
      <div class="header-badge">★ WELCOME TO KITCHEN! ★</div>
      <h1>Cooking Mama: Magic Hub</h1>
      <p class="subtitle">"Wähle aus, was du tun möchtest!"</p>

      <div class="menu-list">
        <!-- Link zum Rechner (wird von Cookies.html zu index.html oder bleibt als Cookies.html) -->
        <a href="Cookies.html" class="menu-btn calculator">
          <span class="menu-icon">📖</span>
          <div style="flex: 1; text-align: left; padding: 0 1rem;">
            <div>Cookie- & Dosis-Rechner</div>
            <div style="font-size: 0.85rem; color: #666; font-weight: 500;">Rezepte, Zutaten & Dosierungen berechnen</div>
          </div>
          <span>➔</span>
        </a>

        <!-- Link zum Minispiel -->
        <a href="Cooking mama game.html" class="menu-btn game">
          <span class="menu-icon">🎮</span>
          <div style="flex: 1; text-align: left; padding: 0 1rem;">
            <div>Interaktives Minispiel</div>
            <div style="font-size: 0.85rem; color: #666; font-weight: 500;">Backen im DS-Stil mit 3 Schwierigkeitsgraden</div>
          </div>
          <span>➔</span>
        </a>
      </div>
    </div>
  </div>

</body>
</html>
